<div class="container my-3">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="input-group mb-3">
        <select
          class="form-select"
          style="max-width: 150px"
          id="categoryId"
          name="categoryId"
          [(ngModel)]="categoryId"
          (change)="loadTasks()"
          required
        >
          <option [ngValue]="null">All Categories</option>
          @for (category of categories(); track category.id) {
            <option [ngValue]="category.id">{{ category.name }}</option>
          }
        </select>
        <input
          class="form-control form-control-lg"
          type="search"
          placeholder="Search"
          aria-label="Search"
          [(ngModel)]="searchTerm"
          name="searchTerm"
        />
        <button (click)="loadTasks()" class="btn btn-primary px-4" type="submit">Search</button>
      </div>
    </div>
  </div>
</div>

<h2 class="text-center my-3">Task List</h2>

@for (task of paginatedTasks(); track task.id) {
  <div class="card m-3">
    <div class="card-header">
      <h5 class="mb-0">{{ task.title }}</h5>
    </div>

    <div class="card-body">
      <p class="card-text mb-3">
        {{ task.description }}
      </p>

      <div class="d-flex align-items-center">
        <span> Category: {{ task.category.name }} </span>

        <div class="form-check ms-4">
          <input
            class="form-check-input"
            type="checkbox"
            [checked]="task.isCompleted"
            id="task-{{ task.id }}"
            (change)="completeTask(task.id!)"
          />
          @if (task.isCompleted) {
            <label class="form-check-label" for="task-{{ task.id }}"> Completed </label>
          } @else {
            <label class="form-check-label" for="task-{{ task.id }}"> Not Completed </label>
          }
        </div>
        <div class="btn-group ms-auto">
          <button routerLink="/task/edit/{{ task.id }}" class="btn btn-primary ms-auto">
            Edit
          </button>
          <button class="btn btn-danger" (click)="deleteTask(task.id!)">Delete</button>
        </div>
      </div>
    </div>
  </div>
}

<div class="d-flex justify-content-center mt-3">
  <nav aria-label="Page navigation">
    <ul class="pagination">
      <li class="page-item">
        <a
          class="page-link"
          href="#"
          (click)="goToPage(currentPage() - 1)"
          [class.disabled]="currentPage() === 1"
        >
          Previous
        </a>
      </li>
      @for (page of pageNumbers; track page) {
        <li class="page-item">
          <a
            class="page-link"
            href="#"
            (click)="goToPage(page + 1)"
            [class.active]="currentPage() === page + 1"
          >
            {{ page + 1 }}
          </a>
        </li>
      }
      <li class="page-item">
        <a
          class="page-link"
          href="#"
          (click)="goToPage(currentPage() + 1)"
          [class.disabled]="currentPage() === totalPages"
        >
          Next
        </a>
      </li>
    </ul>
  </nav>
</div>

<div class="text-center">
  <button routerLink="/task/create" class="btn btn-primary">Create New Task</button>
</div>
