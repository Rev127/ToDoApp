<header class="bg-dark text-white d-flex align-items-center justify-content-between gap-2 p-3">
  <h1 routerLink="/" class="m-0">ToDo App</h1>
  <div class="user-info">
    @if (user$ | async; as user) {
      @if (user.isAuthenticated) {
        <div class="d-flex align-items-center gap-2">
          <p class="m-0">{{ user.name }}</p>
          <button (click)="logout()" class="btn btn-outline-light">Logout</button>
        </div>
      } @else {
        <div class="btn-group">
          <button routerLink="/login" class="btn btn-outline-light">Login</button>
          <button routerLink="/register" class="btn btn-outline-light">Register</button>
        </div>
      }
    }
  </div>
</header>
